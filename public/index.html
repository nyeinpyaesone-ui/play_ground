<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fine-Tuning Studio</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#edf2f7}header{padding:24px 32px;border-bottom:1px solid #26304a}main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#121a2d;border:1px solid #273451;border-radius:14px;padding:18px}.metric{font-size:28px;font-weight:700;margin-top:8px}section{margin-top:24px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.form input,.form select,.form button{padding:11px;border-radius:9px;border:1px solid #34415f;background:#0e1628;color:#fff}button{cursor:pointer;background:#315efb!important;border-color:#315efb!important}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #273451;font-size:14px}.ok{color:#67e8a5}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.form{grid-template-columns:1fr}}</style></head><body><header><strong>⚙ Fine-Tuning Studio</strong><span style="float:right" class="ok">● Control plane online</span></header><main><h1>Training Operations</h1><p>Reusable experiments, measurable outcomes, reproducible configuration.</p><div class="grid"><div class="card">Total Runs<div id="total" class="metric">0</div></div><div class="card">Completed<div id="completed" class="metric">0</div></div><div class="card">Success Rate<div id="rate" class="metric">0%</div></div><div class="card">Avg Eval Score<div id="score" class="metric">0</div></div></div><section class="card"><h2>Launch experiment</h2><div class="form"><input id="name" placeholder="Experiment name" value="baseline-lora"><input id="model" placeholder="Base model" value="meta-llama/Llama-3.2-1B"><input id="dataset" placeholder="Dataset" value="dataset-v1"><select id="method"><option>LoRA</option><option>QLoRA</option><option>SFT</option></select><button onclick="launch()">Start Run</button></div><small id="msg"></small></section><section class="card"><h2>Run history</h2><table><thead><tr><th>Name</th><th>Model</th><th>Method</th><th>Status</th><th>Loss</th><th>Eval</th><th>Throughput</th></tr></thead><tbody id="runs"></tbody></table></section></main><script>async function api(p,o){return fetch(p,o).then(r=>r.json())}async function refresh(){const [a,r]=await Promise.all([api('/api/analytics'),api('/api/runs')]);total.textContent=a.totalRuns;completed.textContent=a.completedRuns;rate.textContent=a.successRate+'%';score.textContent=a.averageEvalScore||'0';runs.innerHTML=r.map(x=>`<tr><td>${x.name}</td><td>${x.baseModel}</td><td>${x.method}</td><td>${x.status}</td><td>${x.loss??'—'}</td><td>${x.evalScore??'—'}</td><td>${x.throughput?x.throughput+' samples/s':'—'}</td></tr>`).join('')}async function launch(){msg.textContent='Submitting…';const r=await api('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name.value,baseModel:model.value,dataset:dataset.value,method:method.value})});msg.textContent=r.error||'Run accepted.';refresh();setTimeout(refresh,2000)}refresh();setInterval(refresh,3000)</script></body></html>
